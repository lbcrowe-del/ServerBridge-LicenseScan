name: Sign & attach release

# Authenticode-signs Invoke-LicenseScan.ps1 with Azure Trusted Signing and
# uploads the signed copy as a release asset. Runs when you publish a GitHub
# Release (or manually to test the pipeline).
#
# Reuses the same secretless setup as the ServerBridge desktop app: auth is via
# OIDC federation (no stored secrets), and signing goes through the shared
# `serverbridge-signing` Trusted Signing account / `serverbridge-publictrust`
# certificate profile.
#
# Prerequisites (one-time):
#   * A `release-signing` GitHub Environment on this repo carrying the non-secret
#     vars: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#     AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT,
#     AZURE_TRUSTED_SIGNING_CERT_PROFILE.
#   * A federated credential on the signing app (AZURE_CLIENT_ID) for this repo's
#     subject:  repo:lbcrowe-del/ServerBridge-LicenseScan:environment:release-signing
#     (the app already holds the Trusted Signing Certificate Profile Signer role).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federation to Azure
  contents: write   # upload the signed asset to the release

jobs:
  sign:
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install sign tool
        run: dotnet tool install --global --prerelease sign

      - name: Sign script (Azure Trusted Signing)
        run: >
          sign code artifact-signing
          --artifact-signing-endpoint ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          --artifact-signing-account ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          --artifact-signing-certificate-profile ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          --azure-credential-type azure-cli
          --file-digest sha256
          --timestamp-url http://timestamp.acs.microsoft.com
          Invoke-LicenseScan.ps1

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature ./Invoke-LicenseScan.ps1
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature not Valid: $($sig.Status) - $($sig.StatusMessage)" }
          Write-Host "Signature is Valid."

      - name: Upload signed script to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./Invoke-LicenseScan.ps1 --clobber
